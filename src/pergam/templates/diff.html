<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>${page_title}</title>
<style>
${css}</style></head><body>

<header class="bar">
  <a class="bar__home" href="/" title="pergam index"><span class="blocks">▮▮</span> pergam</a>
  <h1 class="bar__title">${title}</h1>
  <span class="bar__range">v${old} → v${new}</span>
  <nav class="bar__links"><a href="/">index</a></nav>
</header>

<main class="wrap">

    <span class="arrow" aria-hidden="true">→</span>
    <a class="ver ver--new" href="${new_href}"><span class="ver__n">v${new}</span>${new_note}</a>
  </div>
  <p class="summary">${summary}</p>
  ${sections}
</main>
</body></html>
